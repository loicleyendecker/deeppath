[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]

[project]
name = "deeppath"
description = "Python module to easily manipulate complex nested structures"
requires-python = ">=3.9"
keywords = ["deeppath"]
license = { text = "MIT license" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    'dataclasses; python_version < "3.7"',
    "mypy",
    "esbonio",
    "pylint",
    "doc8",
    "black",
    "towncrier",
    "ruff",
]

[tool.setuptools.package-data]
deeppath = ["py.typed"]
"*" = ["*.rst"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["deeppath"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst"] }
version = { attr = "deeppath.__version__" }

[tool.setuptools_scm]
write_to = "deeppath/_version.py"

[tool.black]
target-version = ["py39"]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# Keep `pytest`/CI fast: benchmarks live here but are excluded from default
# collection (they're not correctness tests and shared CI runners are too noisy
# for perf numbers to mean anything anyway). Run them explicitly with
# `pytest tests/benchmarks`.
norecursedirs = ["tests/benchmarks"]

[tool.towncrier]
package = "deeppath"
package_dir = "deeppath"
filename = "HISTORY.rst"
directory = "changelog/"
title_format = "deeppath {version} ({project_date})"

[tool.ruff]
target-version = "py38"
line-length = 100
